services:
  clouddock:
    image: clouddock-app:hardened
    container_name: clouddock
    ports:
      - "5000:5000"

    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
