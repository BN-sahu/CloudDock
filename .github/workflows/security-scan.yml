
name: CloudDock Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build hardened Docker image
        run: |
          docker build \
            -t clouddock-app:hardened \
            -f Dockerfile \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: clouddock-app:hardened
          format: table
          output: trivy-image-report.txt
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'

      - name: Block image if CRITICAL vulnerabilities are found
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: clouddock-app:hardened
          format: table
          severity: CRITICAL
          vuln-type: os,library
          exit-code: '1'

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push hardened image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_NAME=ghcr.io/bn-sahu/clouddock-app

          docker tag clouddock-app:hardened $IMAGE_NAME:latest
          docker tag clouddock-app:hardened $IMAGE_NAME:${{ github.sha }}

          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

      - name: Upload Trivy scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clouddock-trivy-report
          path: trivy-image-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Notify Slack on success
        if: success() && github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MESSAGE=$(printf 'CloudDock pipeline succeeded!\nRepository: %s\nCommit: %s\nImage: ghcr.io/bn-sahu/clouddock-app:latest\nRun: %s/%s/actions/runs/%s' \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID")

          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          if ! curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"; then
            echo "::warning::Slack success notification could not be delivered"
          fi

      - name: Notify Slack on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MESSAGE=$(printf 'CloudDock pipeline FAILED!\nRepository: %s\nCommit: %s\nRun: %s/%s/actions/runs/%s' \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID")

          PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          if ! curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"; then
            echo "::warning::Slack failure notification could not be delivered"
          fi
